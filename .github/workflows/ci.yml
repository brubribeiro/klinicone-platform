name: CI

on:
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tsc, test, migrate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klinicone
          POSTGRES_PASSWORD: klinicone
          POSTGRES_DB: klinicone_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klinicone -d klinicone_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://klinicone:klinicone@localhost:5432/klinicone_platform?schema=public
      DIRECT_URL: postgresql://klinicone:klinicone@localhost:5432/klinicone_platform?schema=public
      NODE_ENV: test
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --runInBand

  frontend:
    name: Frontend (lint, tsc, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (workspaces)
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck + build check
        working-directory: frontend
        run: npx tsc -b --pretty false
      - name: Test
        working-directory: frontend
        run: npm test
