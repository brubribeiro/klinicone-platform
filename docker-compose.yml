version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: klinicone_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klinicone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klinicone}
      POSTGRES_DB: ${POSTGRES_DB:-klinicone_platform}
    ports:
      - "5432:5432"
    volumes:
      - klinicone_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: klinicone_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles:
      - dev

volumes:
  klinicone_pgdata:
