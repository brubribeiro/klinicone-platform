<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 560" width="800" height="560">
<defs>
<radialGradient id="skin" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#FBE9DD"/><stop offset="1" stop-color="#F1D3C1"/></radialGradient>
<linearGradient id="lipU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D98A86"/><stop offset="1" stop-color="#C7706E"/></linearGradient>
<linearGradient id="lipL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C96E6C"/><stop offset="1" stop-color="#E4A19C"/></linearGradient>
<style>
.skin{fill:url(#skin);stroke:#B98670;stroke-width:3;stroke-linejoin:round}
.line{fill:none;stroke:#A9735D;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fine{fill:none;stroke:#C29682;stroke-width:1.8;stroke-linecap:round;opacity:.85}
.fold{fill:none;stroke:#C98F78;stroke-width:5;stroke-linecap:round;opacity:.45}
.shade{fill:#E3B9A4;opacity:.35}
.anat{fill:none;stroke:#2F7F75;stroke-width:1.8;stroke-dasharray:7 6;stroke-linecap:round;opacity:.75}
.danger{fill:none;stroke:#C0504D;stroke-width:2;stroke-dasharray:3 5;stroke-linecap:round;opacity:.8}
.lip{stroke:#A65553;stroke-width:2.4;stroke-linejoin:round}
.hair{fill:#B48B67;stroke:#8E6A4C;stroke-width:2}
.brow{fill:#8C6A55}
.lead{stroke:#3B5F59;stroke-width:1.2;opacity:.7;fill:none}
.dot{fill:#3B5F59;opacity:.8}
text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;fill:#2E4A45;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
text.c{text-anchor:middle}
text.e{text-anchor:end}
text.t{font-size:14px;font-weight:700;letter-spacing:.6px;fill:#7A8E8A}
</style>
</defs>
<rect width="800" height="560" fill="#fff"/>

<rect width="800" height="560" fill="url(#skin)"/>
<path class="hair" d="M470 0 C 520 90, 560 200, 576 300 C 584 350, 590 390, 606 430 L630 430 C 640 380, 690 340, 800 330 L800 0 Z"/>
<!-- orelha -->
<path class="skin" d="M650 420 C 640 380, 690 352, 730 372 C 770 392, 776 470, 750 520 C 734 552, 700 560, 684 540 C 674 520, 676 496, 664 474 C 656 460, 652 440, 650 420 Z"/>
<path class="fine" d="M684 420 C 700 396, 734 404, 740 440 C 744 476, 724 500, 704 500"/>
<!-- sobrancelha e olho -->
<path class="brow" d="M40 262 C 110 236, 190 232, 256 252 L252 266 C 190 248, 120 252, 46 276 Z"/>
<path class="line" d="M60 334 C 110 310, 170 310, 210 336"/>
<path class="fine" d="M70 346 C 120 362, 170 360, 206 342"/>
<path class="fine" d="M216 340 C 234 336, 248 338, 260 344"/>
<!-- rebordo orbitário lateral -->
<path class="line" d="M258 236 C 292 296, 294 360, 262 424" opacity=".55"/>
<!-- fossa temporal e crista -->
<path class="shade" d="M292 120 C 380 92, 470 140, 474 250 C 476 330, 404 362, 322 342 C 290 300, 280 200, 292 120 Z"/>
<path class="anat" d="M292 120 C 380 92, 470 140, 474 250 C 476 330, 404 362, 322 342 C 290 300, 280 200, 292 120 Z"/>
<path class="anat" d="M120 96 C 220 64, 380 66, 520 120" stroke-dasharray="2 6"/>
<!-- arco zigomático -->
<path class="fold" d="M262 446 C 360 432, 490 436, 640 452"/>
<!-- artéria temporal superficial -->
<path class="danger" d="M646 476 C 626 420, 600 380, 610 320 C 620 260, 590 210, 600 150 C 606 110, 580 70, 590 20"/>
<text x="24" y="34" class="t">TÊMPORAS · LATERAL</text>
<text x="384" y="234" class="c">Fossa temporal</text>
<path class="lead" d="M192 59 L210 76"/><circle class="dot" cx="210" cy="76" r="3"/>
<text x="60" y="64" class="">Crista temporal</text>
<path class="lead" d="M204 205 L232 254"/><circle class="dot" cx="232" cy="254" r="3"/>
<text x="30" y="210" class="">Cauda da sobrancelha</text>
<path class="lead" d="M256 475 L284 380"/><circle class="dot" cx="284" cy="380" r="3"/>
<text x="40" y="480" class="">Rebordo orbitário lateral</text>
<path class="lead" d="M420 502 L420 438"/><circle class="dot" cx="420" cy="438" r="3"/>
<text x="300" y="520" class="">Arco zigomático</text>
<path class="lead" d="M598 46 L598 122"/><circle class="dot" cx="598" cy="122" r="3"/>
<text x="470" y="40" class="">A. temporal superficial</text>

</svg>
