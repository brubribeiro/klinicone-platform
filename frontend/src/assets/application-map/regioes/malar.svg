<!-- olho -->
<path class="brow" d="M330 40 C 420 6, 520 0, 610 30 L606 44 C 520 16, 430 22, 336 54 Z"/>
<path d="M370 116 C 420 70, 520 70, 572 112 C 520 142, 420 146, 370 116 Z" fill="#fff" stroke="#A9735D" stroke-width="2.4"/>
<clipPath id="clipM"><path d="M370 116 C 420 70, 520 70, 572 112 C 520 142, 420 146, 370 116 Z"/></clipPath>
<circle cx="476" cy="108" r="34" fill="#7E948D" clip-path="url(#clipM)"/>
<path class="fine" d="M380 132 C 430 162, 520 160, 568 126"/>
<!-- nariz -->
<path class="fine" d="M650 110 C 662 210, 664 290, 644 340"/>
<path class="line" d="M644 340 C 612 380, 640 424, 700 420 C 730 418, 760 424, 800 426"/>
<ellipse cx="712" cy="404" rx="28" ry="9" fill="#9C6B59" opacity=".45"/>
<!-- boca -->
