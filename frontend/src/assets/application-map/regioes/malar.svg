<path class="lead" d="M622.8 295 L520 362"/><circle class="dot" cx="520" cy="362" r="3"/>
<text x="780" y="300" class="e">Linhas de Hinderer</text>
<path class="lead" d="M698.4 215 L660 380"/><circle class="dot" cx="660" cy="380" r="3"/>
<text x="780" y="220" class="e">Asa nasal</text>

</svg>
