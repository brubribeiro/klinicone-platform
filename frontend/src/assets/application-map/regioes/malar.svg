<path class="danger" style="stroke:#7A8E8A" d="M640 515 L372 116"/>
<text x="24" y="34" class="t">MALAR · HEMIFACE</text>
<path class="lead" d="M158 209 L214 248"/><circle class="dot" cx="214" cy="248" r="3"/>
