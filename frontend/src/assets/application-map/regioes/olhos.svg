<path class="lead" d="M156 317 L300 272"/><circle class="dot" cx="300" cy="272" r="3"/>
<text x="150" y="322" class="e">Pálpebra inferior</text>
<path class="lead" d="M223.60000000000002 435 L300 334"/><circle class="dot" cx="300" cy="334" r="3"/>
<text x="16" y="440" class="">Sulco lacrimal (olheira)</text>
<path class="lead" d="M480 482 L480 346"/><circle class="dot" cx="480" cy="346" r="3"/>
