<clipPath id="clipO"><path d="M222 228 C 292 150, 452 140, 542 214 C 452 268, 300 278, 222 228 Z"/></clipPath>
<g clip-path="url(#clipO)"><circle cx="378" cy="212" r="58" fill="#7E948D"/><circle cx="378" cy="212" r="24" fill="#2D3A37"/><circle cx="394" cy="198" r="8" fill="#fff" opacity=".8"/></g>
<path class="line" d="M222 228 C 292 150, 452 140, 542 214"/>
<path class="fine" d="M232 246 C 320 292, 452 288, 540 226"/>
