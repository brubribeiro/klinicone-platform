<text x="400" y="132" class="c">Músculo frontal</text>
<path class="lead" d="M400 308 L400 400"/><circle class="dot" cx="400" cy="400" r="3"/>
<text x="400" y="302" class="c">Glabela (prócero)</text>
<path class="lead" d="M126 291 L334 340"/><circle class="dot" cx="334" cy="340" r="3"/>
<text x="120" y="296" class="e">Corrugador</text>
