<path class="fine" d="M182 222 C 292 204, 508 204, 618 222"/>
<path class="fine" d="M206 266 C 300 252, 500 252, 594 266"/>
<!-- glabela -->
<path class="fine" d="M384 330 C 381 352, 380 372, 383 392"/>
<path class="fine" d="M416 330 C 419 352, 420 372, 417 392"/>
<path class="fine" d="M392 410 C 400 414, 408 414, 408 410"/>
