</g>
<clipPath id="clipT"><path d="M226 486 C 250 452, 330 452, 352 482 Z"/></clipPath>
<use xlink:href="#eyeT" transform="matrix(-1 0 0 1 800 0)"/>
<!-- dorso nasal -->
<path class="fine" d="M372 430 C 380 480, 384 520, 384 560"/>
<path class="fine" d="M428 430 C 420 480, 416 520, 416 560"/>
